name: Approval Host client module contracts
on:
  push:
    branches: [fix/approval-interaction]
    paths: [.github/workflows/approval-host-diagnose.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
      - name: Read published native client contracts without executing package code
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/client-contracts"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/client-contracts" \
            @deepseek-ai/dsh-client-modules@0.1.5-rc.3 \
            @deepseek-ai/dsh-client-modules@0.1.2-rc.1 \
            @deepseek-ai/dsh-cordis-client-runner@0.1.5-rc.3 \
            @deepseek-ai/dsh-host-webserver@0.1.5-rc.3 \
            @deepseek-ai/dsh-api-session-controller@0.1.2-rc.1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: approval-client-contracts
          path: ${{ runner.temp }}/client-contracts
          retention-days: 1
