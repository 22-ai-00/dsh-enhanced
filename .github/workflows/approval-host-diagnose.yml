name: Approval Host protocol diagnosis
on:
  push:
    branches: [fix/approval-interaction]
    paths: [.github/workflows/approval-host-diagnose.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
      - name: Inspect a private supported Host without executing install scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/protocol-host" "$RUNNER_TEMP/approval-protocol"
          npm install --prefix "$RUNNER_TEMP/protocol-host" --ignore-scripts --prefer-dedupe --no-audit --no-fund @deepseek-ai/dsh@0.1.5-rc.1
          export HOST_ROOT="$RUNNER_TEMP/protocol-host/node_modules"
          export OUTPUT_ROOT="$RUNNER_TEMP/approval-protocol"
          node --input-type=module <<'JS'
          import { readdirSync, readFileSync, mkdirSync, copyFileSync, writeFileSync } from 'node:fs'
          import { join, relative, dirname } from 'node:path'
          const root = process.env.HOST_ROOT, out = process.env.OUTPUT_ROOT
          const selected = new Set(['dsh-api-session-controller', 'dsh-session-projection', 'dsh-client-ui-conversation', 'dsh-client-ui-session', 'dsh-agent-loop', 'dsh-llm'])
          const versions = []
          let bytes = 0
          function inspect(path) {
            for (const entry of readdirSync(path, { withFileTypes: true })) {
              const file = join(path, entry.name)
              if (!entry.isDirectory()) continue
              if (path.endsWith('/@deepseek-ai') && entry.name.startsWith('dsh')) {
                const pkg = JSON.parse(readFileSync(join(file, 'package.json'), 'utf8'))
                versions.push({ path: relative(root, file), name: pkg.name, version: pkg.version, dependencies: pkg.dependencies })
                if (selected.has(entry.name)) collect(file)
              }
              if (entry.name === 'node_modules' || path.endsWith('/node_modules') || entry.name.startsWith('@')) inspect(file)
            }
          }
          function collect(path) {
            for (const entry of readdirSync(path, { withFileTypes: true })) {
              const file = join(path, entry.name)
              if (entry.name === 'node_modules') continue
              if (entry.isDirectory()) { collect(file); continue }
              if (!entry.isFile() || !/\.(?:json|[cm]?js|ts)$/.test(entry.name)) continue
              const content = readFileSync(file)
              if ((bytes += content.length) > 20 * 1024 * 1024) throw new Error('diagnostic source bound exceeded')
              const target = join(out, relative(root, file))
              mkdirSync(dirname(target), { recursive: true })
              copyFileSync(file, target)
            }
          }
          inspect(root)
          writeFileSync(join(out, 'versions.json'), JSON.stringify(versions, null, 2))
          console.log(JSON.stringify({ packages: versions.length, sourceBytes: bytes }))
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: approval-host-protocol
          path: ${{ runner.temp }}/approval-protocol
          retention-days: 1
