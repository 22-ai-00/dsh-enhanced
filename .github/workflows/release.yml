name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag to retry (for example, v1.2.3)
        required: true
        type: string

concurrency:
  group: npm-release
  cancel-in-progress: false

env:
  VITEST_MAX_WORKERS: '2'
  DSH_TEST_CONCURRENCY: '2'
  DSH_NIGHTLY_FULL_MATRIX: '0'

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: npm-release
    outputs:
      source_commit: ${{ steps.release_source.outputs.source_commit }}
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag is current main
        id: release_source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must be a stable semantic version in the form vX.Y.Z: ${RELEASE_TAG}" >&2
            exit 1
          fi
          auth_header="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          tag_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          checkout_commit="$(git rev-parse --verify 'HEAD^{commit}')"
          main_commit="$(git rev-parse --verify 'refs/remotes/origin/main^{commit}')"
          if [[ "${checkout_commit}" != "${tag_commit}" ]]; then
            echo "Checked-out commit ${checkout_commit} does not match ${RELEASE_TAG} (${tag_commit})." >&2
            exit 1
          fi
          if [[ "${tag_commit}" != "${main_commit}" ]]; then
            echo "Release tag ${RELEASE_TAG} (${tag_commit}) is not current origin/main (${main_commit})." >&2
            exit 1
          fi
          echo "RELEASE_SOURCE_COMMIT=${main_commit}" >> "${GITHUB_ENV}"
          echo "source_commit=${main_commit}" >> "${GITHUB_OUTPUT}"

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Verify release tag and pending versions
        run: node ./scripts/release-version.mjs verify-tag "${RELEASE_TAG}"

      - name: Verify npm credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo 'GitHub OIDC trusted publishing is unavailable (missing ACTIONS_ID_TOKEN_REQUEST_URL or ACTIONS_ID_TOKEN_REQUEST_TOKEN; ensure permissions.id-token: write and environment: npm-release).' >&2
            exit 1
          fi
          if [[ -n "${NODE_AUTH_TOKEN:-}" ]]; then
            echo 'NODE_AUTH_TOKEN must be unset when using GitHub OIDC trusted publishing.' >&2
            exit 1
          fi
          node -e '
            const { execFileSync } = require("node:child_process");
            const parse = (v) => v.trim().replace(/^v/, "").split(".").map(Number);
            const gte = (a, b) => {
              for (let i = 0; i < 3; i += 1) {
                if ((a[i] || 0) !== (b[i] || 0)) return (a[i] || 0) > (b[i] || 0);
              }
              return true;
            };
            const nodeVer = process.versions.node;
            const npmVer = execFileSync("npm", ["--version"], { encoding: "utf8" }).trim();
            const pnpmVer = execFileSync("pnpm", ["--version"], { encoding: "utf8" }).trim();
            if (!gte(parse(nodeVer), [24, 9, 0])) {
              throw new Error(`Node >=24.9.0 is required for OIDC publishing (got ${nodeVer})`);
            }
            if (!gte(parse(npmVer), [11, 5, 1])) {
              throw new Error(`npm >=11.5.1 is required for OIDC publishing (got ${npmVer})`);
            }
            if (pnpmVer !== "11.7.0") {
              throw new Error(`pnpm 11.7.0 is required for OIDC publishing (got ${pnpmVer})`);
            }
            console.log(`GitHub OIDC trusted publishing ready (Node v${nodeVer}, npm ${npmVer}, pnpm ${pnpmVer}).`);
          '

      - name: Verify CI gate and build release packages
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node -e '
            const repo = process.env.GITHUB_REPOSITORY;
            const sha = process.env.RELEASE_SOURCE_COMMIT;
            const token = process.env.GITHUB_TOKEN;
            if (!repo || !sha || !token) {
              throw new Error("Missing GITHUB_REPOSITORY, RELEASE_SOURCE_COMMIT, or GITHUB_TOKEN");
            }
            const headers = {
              Accept: "application/vnd.github+json",
              Authorization: `Bearer ${token}`,
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "dsh-ray-release-ci-gate",
            };
            const requiredLanes = [
              "linux-packages",
              "linux-slow-package-tests",
              "linux-root-tests",
              "macos-verify",
              "windows-acp-smoke",
              "verify",
            ];
            async function ghJson(path) {
              const res = await fetch(`https://api.github.com${path}`, { headers });
              if (!res.ok) {
                throw new Error(`GitHub API ${path} returned HTTP ${res.status}: ${await res.text()}`);
              }
              return await res.json();
            }
            const deadline = Date.now() + 30 * 60 * 1000;
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
            (async () => {
              while (true) {
                const data = await ghJson(`/repos/${repo}/actions/workflows/ci.yml/runs?head_sha=${encodeURIComponent(sha)}&per_page=20`);
                const matching = (data.workflow_runs || []).filter((r) => r.head_sha === sha);
                for (const run of matching) {
                  if (run.status === "completed" && run.conclusion === "success") {
                    const jobsData = await ghJson(`/repos/${repo}/actions/runs/${run.id}/jobs?per_page=50`);
                    const jobs = jobsData.jobs || [];
                    const verifyJob = jobs.find((j) => j.name === "verify");
                    const lanesOk = requiredLanes.every((prefix) => {
                      const laneJobs = jobs.filter((j) => j.name === prefix || j.name.startsWith(`${prefix} (`));
                      return laneJobs.length > 0 && laneJobs.every((j) => j.status === "completed" && j.conclusion === "success");
                    });
                    if (verifyJob && verifyJob.status === "completed" && verifyJob.conclusion === "success" && lanesOk) {
                      console.log(`CI gate passed via ci.yml run ${run.id} (${run.html_url}) for ${sha}`);
                      return;
                    }
                  }
                }
                const active = matching.some((r) => ["queued", "in_progress", "waiting", "requested", "pending"].includes(r.status));
                if (!active) {
                  const summary = matching.map((r) => `${r.id}:${r.status}:${r.conclusion}`).join(", ") || "<none>";
                  throw new Error(`CI gate (ci.yml + verify) has not passed for ${sha}. Runs: ${summary}`);
                }
                if (Date.now() >= deadline) {
                  throw new Error(`Timed out after 30m waiting for ci.yml on ${sha}`);
                }
                console.log(`Waiting for ci.yml run on ${sha}...`);
                await sleep(15_000);
              }
            })().catch((err) => {
              console.error(err instanceof Error ? err.message : String(err));
              process.exit(1);
            });
          '

          pnpm install --frozen-lockfile
          verify_log="${RUNNER_TEMP}/verify-release-build.log"
          verify_status=0
          (pnpm run validate && pnpm run lint && pnpm run build && pnpm run typecheck:built && pnpm run pack:check) 2>&1 | tee "${verify_log}" || verify_status=$?
          if [ "${verify_status}" -ne 0 ]; then
            printf 'verify release build status: %s\n' "${verify_status}"
            grep -aE '(^| )(FAIL|×) |AssertionError|Error: |ERR_PNPM|error TS' "${verify_log}" \
              | grep -av 'ExperimentalWarning' | head -40 \
              | sed -e 's/%/%25/g' -e 's/\r//g' -e 's/^/::error::/' || true
            tail -30 "${verify_log}" | sed -e 's/%/%25/g' -e 's/\r//g' -e 's/^/::error::/' || true
            exit 1
          fi

      - name: Recheck release source and tracked tree
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth_header="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          current_tag="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          current_main="$(git rev-parse --verify 'refs/remotes/origin/main^{commit}')"
          if [[ "${current_tag}" != "${RELEASE_SOURCE_COMMIT}" ]]; then
            echo "Release tag ${RELEASE_TAG} moved from ${RELEASE_SOURCE_COMMIT} to ${current_tag}; refusing to publish." >&2
            exit 1
          fi
          if [[ "${current_main}" != "${RELEASE_SOURCE_COMMIT}" ]]; then
            echo "origin/main advanced from ${RELEASE_SOURCE_COMMIT} to ${current_main}; refusing to publish." >&2
            exit 1
          fi
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo 'Tracked files changed after verification; refusing to publish.' >&2
            git status --short --untracked-files=no >&2
            exit 1
          fi

      - name: Publish packages
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo 'GitHub OIDC trusted publishing is unavailable (missing ACTIONS_ID_TOKEN_REQUEST_URL or ACTIONS_ID_TOKEN_REQUEST_TOKEN).' >&2
            exit 1
          fi
          unset NODE_AUTH_TOKEN || true
          for npmrc_path in "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}" "$HOME/.npmrc"; do
            if [[ -n "${npmrc_path}" && -f "${npmrc_path}" ]]; then
              grep -Ev '(^|:)_authToken=|//registry\.npmjs\.org/:_authToken=' "${npmrc_path}" > "${npmrc_path}.tmp" || true
              mv "${npmrc_path}.tmp" "${npmrc_path}"
            fi
          done
          pnpm release:publish

  verify-npm:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      EXPECTED_RELEASE_SOURCE_COMMIT: ${{ needs.publish.outputs.source_commit }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify checked-out commit matches published source
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${EXPECTED_RELEASE_SOURCE_COMMIT:-}" ]]; then
            echo 'Publish job did not provide its verified source commit; refusing to verify.' >&2
            exit 1
          fi
          checkout_commit="$(git rev-parse --verify 'HEAD^{commit}')"
          if [[ "${checkout_commit}" != "${EXPECTED_RELEASE_SOURCE_COMMIT}" ]]; then
            echo "Checked-out commit ${checkout_commit} does not match published commit ${EXPECTED_RELEASE_SOURCE_COMMIT}." >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Verify all published packages on npm
        run: node ./scripts/verify-npm-release.mjs --tag "${RELEASE_TAG}" --verify-tarball

  record:
    needs: [publish, verify-npm]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      EXPECTED_RELEASE_SOURCE_COMMIT: ${{ needs.publish.outputs.source_commit }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Verify release source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth_header="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          tag_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          checkout_commit="$(git rev-parse --verify 'HEAD^{commit}')"
          main_commit="$(git rev-parse --verify 'refs/remotes/origin/main^{commit}')"
          if [[ -z "${EXPECTED_RELEASE_SOURCE_COMMIT:-}" ]]; then
            echo 'Publish job did not provide its verified source commit; refusing to record.' >&2
            exit 1
          fi
          if [[ "${checkout_commit}" != "${tag_commit}" ]]; then
            echo "Checked-out commit ${checkout_commit} does not match ${RELEASE_TAG} (${tag_commit}); refusing to record." >&2
            exit 1
          fi
          if [[ "${tag_commit}" != "${main_commit}" ]]; then
            echo "Release tag ${RELEASE_TAG} (${tag_commit}) is not current origin/main (${main_commit}); refusing to record." >&2
            exit 1
          fi
          if [[ "${tag_commit}" != "${EXPECTED_RELEASE_SOURCE_COMMIT}" ]]; then
            echo "Release source changed after publish from ${EXPECTED_RELEASE_SOURCE_COMMIT} to ${tag_commit}; refusing to record." >&2
            exit 1
          fi
          echo "RELEASE_SOURCE_COMMIT=${EXPECTED_RELEASE_SOURCE_COMMIT}" >> "${GITHUB_ENV}"

      - name: Record release manifest
        shell: bash
        run: |
          set -euo pipefail
          node ./scripts/release-version.mjs verify-tag "${RELEASE_TAG}"
          node ./scripts/release-version.mjs record
          changed_files="$(git diff --name-only)"
          if [[ "${changed_files}" != 'release-manifest.json' ]]; then
            echo 'Record step must change only release-manifest.json.' >&2
            printf 'Changed files:\n%s\n' "${changed_files:-<none>}" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- release-manifest.json
          if [[ "$(git diff --cached --name-only)" != 'release-manifest.json' ]]; then
            echo 'Refusing to commit files other than release-manifest.json.' >&2
            exit 1
          fi
          git commit -m "chore(release): record ${RELEASE_TAG}"

      - name: Push release record to main
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth_header="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          current_main="$(git rev-parse --verify 'refs/remotes/origin/main^{commit}')"
          if [[ "${current_main}" != "${RELEASE_SOURCE_COMMIT}" ]]; then
            echo "origin/main advanced from ${RELEASE_SOURCE_COMMIT} to ${current_main}; refusing to push the release record." >&2
            exit 1
          fi
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:main
