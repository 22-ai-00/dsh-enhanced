name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag to retry (for example, v1.2.3)
        required: true
        type: string

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-release
    outputs:
      source_commit: ${{ steps.release_source.outputs.source_commit }}
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag is current main
        id: release_source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must be a stable semantic version in the form vX.Y.Z: ${RELEASE_TAG}" >&2
            exit 1
          fi
          auth_header="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          tag_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          checkout_commit="$(git rev-parse --verify 'HEAD^{commit}')"
          main_commit="$(git rev-parse --verify 'refs/remotes/origin/main^{commit}')"
          if [[ "${checkout_commit}" != "${tag_commit}" ]]; then
            echo "Checked-out commit ${checkout_commit} does not match ${RELEASE_TAG} (${tag_commit})." >&2
            exit 1
          fi
          if [[ "${tag_commit}" != "${main_commit}" ]]; then
            echo "Release tag ${RELEASE_TAG} (${tag_commit}) is not current origin/main (${main_commit})." >&2
            exit 1
          fi
          echo "RELEASE_SOURCE_COMMIT=${main_commit}" >> "${GITHUB_ENV}"
          echo "source_commit=${main_commit}" >> "${GITHUB_OUTPUT}"

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Verify Linux E2E prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
            bubblewrap \
            file \
            git \
            python3 \
            tar

          command -v bwrap >/dev/null
          command -v git >/dev/null
          command -v tar >/dev/null
          command -v python3 >/dev/null
          test -d /proc/self/fd

          # ubuntu-latest enables an AppArmor restriction that lets bwrap create
          # most namespaces but blocks the loopback setup for --unshare-net.
          # The hosted runner is ephemeral; relax it here so the adapter test
          # still exercises its real, network-isolated bubblewrap sandbox.
          if [[ -r /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]] \
            && [[ "$(</proc/sys/kernel/apparmor_restrict_unprivileged_userns)" == '1' ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          /usr/bin/bwrap \
            --unshare-all \
            --die-with-parent \
            --new-session \
            --ro-bind /usr /usr \
            --ro-bind /lib /lib \
            --ro-bind /lib64 /lib64 \
            --proc /proc \
            --dev /dev \
            /usr/bin/true

      - name: Install native pnpm test runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime_prefix="${RUNNER_TEMP}/dsh-test-pnpm"
          npm install \
            --prefix "${runtime_prefix}" \
            --no-audit \
            --no-fund \
            --no-save \
            --package-lock=false \
            @pnpm/exe@11.7.0

          pnpm_root="${runtime_prefix}/node_modules/@pnpm/exe"
          node -e '
            const manifest = require(process.argv[1]);
            if (manifest.name !== "@pnpm/exe" || manifest.version !== "11.7.0") {
              throw new Error(`unexpected pnpm runtime: ${manifest.name}@${manifest.version}`);
            }
          ' "${pnpm_root}/package.json"
          test -x "${pnpm_root}/pnpm"
          file "${pnpm_root}/pnpm" | grep -Eq 'ELF .* executable'
          printf 'DSH_TEST_PNPM_ROOT=%s\n' "${pnpm_root}" >> "${GITHUB_ENV}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository
        run: pnpm check

      - name: Verify release tag and pending versions
        run: node ./scripts/release-version.mjs verify-tag "${RELEASE_TAG}"

      - name: Verify npm credentials
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo 'NPM_TOKEN is not configured.' >&2
            exit 1
          fi
          npm whoami --registry=https://registry.npmjs.org

      - name: Recheck release source and tracked tree
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth_header="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          current_tag="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          current_main="$(git rev-parse --verify 'refs/remotes/origin/main^{commit}')"
          if [[ "${current_tag}" != "${RELEASE_SOURCE_COMMIT}" ]]; then
            echo "Release tag ${RELEASE_TAG} moved from ${RELEASE_SOURCE_COMMIT} to ${current_tag}; refusing to publish." >&2
            exit 1
          fi
          if [[ "${current_main}" != "${RELEASE_SOURCE_COMMIT}" ]]; then
            echo "origin/main advanced from ${RELEASE_SOURCE_COMMIT} to ${current_main}; refusing to publish." >&2
            exit 1
          fi
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo 'Tracked files changed after verification; refusing to publish.' >&2
            git status --short --untracked-files=no >&2
            exit 1
          fi

      - name: Publish packages
        run: pnpm release:publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  record:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      EXPECTED_RELEASE_SOURCE_COMMIT: ${{ needs.publish.outputs.source_commit }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Verify release source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth_header="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          tag_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          checkout_commit="$(git rev-parse --verify 'HEAD^{commit}')"
          main_commit="$(git rev-parse --verify 'refs/remotes/origin/main^{commit}')"
          if [[ -z "${EXPECTED_RELEASE_SOURCE_COMMIT:-}" ]]; then
            echo 'Publish job did not provide its verified source commit; refusing to record.' >&2
            exit 1
          fi
          if [[ "${checkout_commit}" != "${tag_commit}" ]]; then
            echo "Checked-out commit ${checkout_commit} does not match ${RELEASE_TAG} (${tag_commit}); refusing to record." >&2
            exit 1
          fi
          if [[ "${tag_commit}" != "${main_commit}" ]]; then
            echo "Release tag ${RELEASE_TAG} (${tag_commit}) is not current origin/main (${main_commit}); refusing to record." >&2
            exit 1
          fi
          if [[ "${tag_commit}" != "${EXPECTED_RELEASE_SOURCE_COMMIT}" ]]; then
            echo "Release source changed after publish from ${EXPECTED_RELEASE_SOURCE_COMMIT} to ${tag_commit}; refusing to record." >&2
            exit 1
          fi
          echo "RELEASE_SOURCE_COMMIT=${EXPECTED_RELEASE_SOURCE_COMMIT}" >> "${GITHUB_ENV}"

      - name: Record release manifest
        shell: bash
        run: |
          set -euo pipefail
          node ./scripts/release-version.mjs verify-tag "${RELEASE_TAG}"
          node ./scripts/release-version.mjs record
          changed_files="$(git diff --name-only)"
          if [[ "${changed_files}" != 'release-manifest.json' ]]; then
            echo 'Record step must change only release-manifest.json.' >&2
            printf 'Changed files:\n%s\n' "${changed_files:-<none>}" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- release-manifest.json
          if [[ "$(git diff --cached --name-only)" != 'release-manifest.json' ]]; then
            echo 'Refusing to commit files other than release-manifest.json.' >&2
            exit 1
          fi
          git commit -m "chore(release): record ${RELEASE_TAG}"

      - name: Push release record to main
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth_header="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          current_main="$(git rev-parse --verify 'refs/remotes/origin/main^{commit}')"
          if [[ "${current_main}" != "${RELEASE_SOURCE_COMMIT}" ]]; then
            echo "origin/main advanced from ${RELEASE_SOURCE_COMMIT} to ${current_main}; refusing to push the release record." >&2
            exit 1
          fi
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:main
