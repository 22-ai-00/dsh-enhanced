name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
  # Nightly full gate (03:41 UTC ≈ 11:41 Beijing). Existing lanes are already
  # the full matrix, so nightly equals a push run; a dedicated lane for
  # heavier matrices lands with the test-tiering work. Off-minute on purpose.
  schedule:
    - cron: '41 3 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Ubuntu runners have 4 vCPU. Keep two workers per package (timing-sensitive
  # suites starve at higher oversubscription). The package lane keeps four
  # package slots busy: plugin-control-plane and lark-channel each take a
  # background slot from t=0, the remainder runs two at a time in the
  # foreground. macOS runners (3 vCPU) override these in their job.
  VITEST_MAX_WORKERS: '2'
  # Tiered test matrices (e.g. the Delivery schema 23-31 migration sweep) run
  # every version only on the nightly schedule; push and PR runs keep the
  # first/last representatives.
  DSH_NIGHTLY_FULL_MATRIX: ${{ github.event_name == 'schedule' && '1' || '0' }}

jobs:
  linux-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.7.0
          run_install: false

      - name: Set up pinned Linux test Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'

      - name: Install pinned Linux test Node
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = 'v22.23.2'
          test_node="$(node -p 'process.execPath')"
          # Namespace tests expose /usr read-only; workspace Node stays separate.
          sudo install --owner=root --group=root --mode=0755 "${test_node}" /usr/bin/node
          cmp "${test_node}" /usr/bin/node
          test "$(/usr/bin/node --version)" = 'v22.23.2'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Verify Linux E2E prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v$(cat .node-version)"
          test "$(/usr/bin/node --version)" = 'v22.23.2'
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
            bubblewrap \
            file \
            git \
            python3 \
            tar

          command -v bwrap >/dev/null
          command -v git >/dev/null
          command -v tar >/dev/null
          command -v python3 >/dev/null
          test -d /proc/self/fd

          # ubuntu-latest enables an AppArmor restriction that lets bwrap create
          # most namespaces but blocks the loopback setup for --unshare-net.
          # The hosted runner is ephemeral; relax it here so the adapter test
          # still exercises its real, network-isolated bubblewrap sandbox.
          if [[ -r /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]] \
            && [[ "$(</proc/sys/kernel/apparmor_restrict_unprivileged_userns)" == '1' ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          /usr/bin/bwrap \
            --unshare-all \
            --die-with-parent \
            --new-session \
            --ro-bind /usr /usr \
            --ro-bind /lib /lib \
            --ro-bind /lib64 /lib64 \
            --proc /proc \
            --dev /dev \
            /usr/bin/true

      - name: Install native pnpm test runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime_prefix="${RUNNER_TEMP}/dsh-test-pnpm"
          npm install \
            --prefix "${runtime_prefix}" \
            --no-audit \
            --no-fund \
            --no-save \
            --package-lock=false \
            @pnpm/exe@11.7.0

          pnpm_root="${runtime_prefix}/node_modules/@pnpm/exe"
          node -e '
            const manifest = require(process.argv[1]);
            if (manifest.name !== "@pnpm/exe" || manifest.version !== "11.7.0") {
              throw new Error(`unexpected pnpm runtime: ${manifest.name}@${manifest.version}`);
            }
          ' "${pnpm_root}/package.json"
          test -x "${pnpm_root}/pnpm"
          file "${pnpm_root}/pnpm" | grep -Eq 'ELF .* executable'
          printf 'DSH_TEST_PNPM_ROOT=%s\n' "${pnpm_root}" >> "${GITHUB_ENV}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate and lint repository
        run: pnpm run validate && pnpm run lint

      - name: Build and typecheck packages
        run: pnpm run build && pnpm run typecheck:built

      - name: Verify package tests
        shell: bash
        run: |
          set -o pipefail
          # Lead with the two slowest packages. In directory order pnpm --no-sort
          # only starts plugin-control-plane after ~297s, and that package alone
          # needs ~1052s, so it takes a background slot from t=0 instead. The two
          # slots plus the two-pack-wide foreground keep four packages running,
          # the same load as before. plugin-control-plane is the critical path, so the two
          # sibling lanes run at lower CPU priority and only use cores it is not using.
          control_plane_log="${RUNNER_TEMP}/package-tests-plugin-control-plane.log"
          lark_channel_log="${RUNNER_TEMP}/package-tests-lark-channel.log"
          rest_log="${RUNNER_TEMP}/package-tests-rest.log"
          pnpm run test:packages:control-plane > "${control_plane_log}" 2>&1 &
          control_plane_pid=$!
          nice -n 10 pnpm run test:packages:lark-channel > "${lark_channel_log}" 2>&1 &
          lark_channel_pid=$!

          rest_status=0
          nice -n 10 pnpm run test:packages:rest > "${rest_log}" 2>&1 || rest_status=$?
          # Wait for both slots even when the foreground already failed so no
          # package test process outlives the step and the full logs survive.
          control_plane_status=0
          wait "${control_plane_pid}" || control_plane_status=$?
          lark_channel_status=0
          wait "${lark_channel_pid}" || lark_channel_status=$?

          # Fixed merge order keeps the artifact (and the diagnostics below) stable.
          cat "${control_plane_log}" "${lark_channel_log}" "${rest_log}" \
            > "${RUNNER_TEMP}/package-tests.log"
          if [ "${control_plane_status}" -ne 0 ] || [ "${lark_channel_status}" -ne 0 ] \
            || [ "${rest_status}" -ne 0 ]; then
            printf 'package test slots: plugin-control-plane=%s lark-channel=%s remainder=%s\n' \
              "${control_plane_status}" "${lark_channel_status}" "${rest_status}"
            # Job logs need repo-admin rights to download; on failure surface the
            # failing test lines as check-run annotations instead so a red lane is
            # diagnosable from the public API.
            grep -aE '(^| )(FAIL|×) |Error: |ERR_PNPM' "${RUNNER_TEMP}/package-tests.log" \
              | grep -av 'ExperimentalWarning' | head -40 \
              | sed -e 's/%/%25/g' -e 's/\r//g' -e 's/^/::error::/' || true
            tail -30 "${RUNNER_TEMP}/package-tests.log" | sed -e 's/%/%25/g' -e 's/\r//g' -e 's/^/::error::/' || true
            exit 1
          fi

      - name: Verify package packs
        run: pnpm run pack:check

      - name: Retain package test diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-package-tests-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/package-tests.log
          if-no-files-found: ignore
          retention-days: 7

  linux-root-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # The root sequencer puts the two slow installer groups on separate
        # runners and keeps Vitest's default split for other files. A failing
        # shard never cancels its sibling.
        shard: [1, 2]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.7.0
          run_install: false

      - name: Set up pinned Linux test Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'

      - name: Install pinned Linux test Node
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = 'v22.23.2'
          test_node="$(node -p 'process.execPath')"
          # Namespace tests expose /usr read-only; workspace Node stays separate.
          sudo install --owner=root --group=root --mode=0755 "${test_node}" /usr/bin/node
          cmp "${test_node}" /usr/bin/node
          test "$(/usr/bin/node --version)" = 'v22.23.2'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Verify Linux E2E prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v$(cat .node-version)"
          test "$(/usr/bin/node --version)" = 'v22.23.2'
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
            bubblewrap \
            file \
            git \
            python3 \
            tar

          command -v bwrap >/dev/null
          command -v git >/dev/null
          command -v tar >/dev/null
          command -v python3 >/dev/null
          test -d /proc/self/fd

          # The hosted runner needs loopback setup for the real --unshare-net
          # bubblewrap tests, just like the package lane.
          if [[ -r /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]] \
            && [[ "$(</proc/sys/kernel/apparmor_restrict_unprivileged_userns)" == '1' ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          /usr/bin/bwrap \
            --unshare-all \
            --die-with-parent \
            --new-session \
            --ro-bind /usr /usr \
            --ro-bind /lib /lib \
            --ro-bind /lib64 /lib64 \
            --proc /proc \
            --dev /dev \
            /usr/bin/true

      - name: Install native pnpm test runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime_prefix="${RUNNER_TEMP}/dsh-test-pnpm"
          npm install \
            --prefix "${runtime_prefix}" \
            --no-audit \
            --no-fund \
            --no-save \
            --package-lock=false \
            @pnpm/exe@11.7.0

          pnpm_root="${runtime_prefix}/node_modules/@pnpm/exe"
          node -e '
            const manifest = require(process.argv[1]);
            if (manifest.name !== "@pnpm/exe" || manifest.version !== "11.7.0") {
              throw new Error(`unexpected pnpm runtime: ${manifest.name}@${manifest.version}`);
            }
          ' "${pnpm_root}/package.json"
          test -x "${pnpm_root}/pnpm"
          file "${pnpm_root}/pnpm" | grep -Eq 'ELF .* executable'
          printf 'DSH_TEST_PNPM_ROOT=%s\n' "${pnpm_root}" >> "${GITHUB_ENV}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build root test dependencies
        run: pnpm run build

      - name: Verify root tests (shard)
        shell: bash
        run: |
          set -o pipefail
          if ! pnpm exec vitest run --config ./tests/vitest.config.ts --testTimeout=15000 --dir tests --shard=${{ matrix.shard }}/2 --reporter=default --reporter=json --outputFile.json="${RUNNER_TEMP}/root-tests.json" > "${RUNNER_TEMP}/root-tests.log" 2>&1; then
            grep -aE '(^| )(FAIL|×) |AssertionError|Error: ' "${RUNNER_TEMP}/root-tests.log" \
              | grep -av 'ExperimentalWarning' | head -40 \
              | sed -e 's/%/%25/g' -e 's/\r//g' -e 's/^/::error::/' || true
            tail -30 "${RUNNER_TEMP}/root-tests.log" | sed -e 's/%/%25/g' -e 's/\r//g' -e 's/^/::error::/' || true
            exit 1
          fi
          tail -10 "${RUNNER_TEMP}/root-tests.log"

      - name: Summarize root test timings
        if: ${{ always() }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, existsSync, readFileSync } from 'node:fs';
          import { join, relative } from 'node:path';
          const file = join(process.env.RUNNER_TEMP, 'root-tests.json');
          if (!existsSync(file)) process.exit(0);
          const report = JSON.parse(readFileSync(file, 'utf8'));
          const files = report.testResults.map(suite => ({
            path: relative(process.cwd(), suite.name),
            seconds: (suite.endTime - suite.startTime) / 1000,
          })).sort((left, right) => right.seconds - left.seconds);
          const summary = [
            '### Root test timings',
            `${report.numPassedTests} passed, ${report.numFailedTests} failed, ${report.numPendingTests} skipped.`,
            '', '| Test file | Seconds |', '| --- | ---: |',
            ...files.slice(0, 15).map(file => `| ${file.path} | ${file.seconds.toFixed(2)} |`), '',
          ].join('\n');
          console.log(summary);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          NODE

      - name: Retain root test diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-root-tests-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/root-tests.log
            ${{ runner.temp }}/root-tests.json
          if-no-files-found: ignore
          retention-days: 7

  verify:
    needs: [linux-packages, linux-root-tests, macos-verify, windows-acp-smoke]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify all CI lanes
        shell: bash
        run: |
          packages='${{ needs.linux-packages.result }}'
          root='${{ needs.linux-root-tests.result }}'
          macos='${{ needs.macos-verify.result }}'
          windows='${{ needs.windows-acp-smoke.result }}'
          printf 'linux-packages=%s linux-root-tests=%s macos-verify=%s windows-acp-smoke=%s\n' "$packages" "$root" "$macos" "$windows"
          test "$packages" = success
          test "$root" = success
          test "$macos" = success
          test "$windows" = success

  macos-verify:
    # The installers document macOS LaunchAgent support and the Control Plane
    # loaders compare `realpath` against `resolve`, which behaves differently on
    # a host whose temporary directory is reached through the `/var ->
    # /private/var` symlink. Running the suite here keeps that claimed platform
    # verified instead of trusting the Linux job for it. Linux-only suites
    # (bubblewrap sandbox, root-owned system dirs) skip themselves by platform.
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      # macOS runners expose 3 vCPU; cap workers to that instead of the global 4.
      VITEST_MAX_WORKERS: '2'
      DSH_TEST_CONCURRENCY: '3'
      PNPM_CONFIG_WORKSPACE_CONCURRENCY: '2'
      DSH_NATIVE_LAUNCHD_TEST: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Verify bundled macOS shell
        shell: bash
        run: |
          set -euo pipefail
          # The installer must stay compatible with the bundled Bash 3.2, which
          # has no `BASHPID` and differs on empty-array expansion under nounset.
          /bin/bash --version | head -1
          # Keep the system TMPDIR so /var aliases exercise production path
          # handling. Socket fixtures select their own short canonical roots.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify native macOS paths early
        shell: bash
        run: |
          set -euo pipefail
          # Report platform fixture and launchd failures before the long
          # Control Plane integration suite; the full check still follows.
          pnpm run build
          pnpm --filter @dsh-enhanced/plugin-control-plane exec vitest run --testTimeout=15000 tests/source-build.spec.ts
          pnpm --filter @dsh-enhanced/assistant-isolation exec vitest run --testTimeout=15000 tests/native-macos.spec.ts tests/controller-startup.spec.ts tests/state-socket-binding.spec.ts tests/storage.spec.ts tests/mac-socket.spec.ts
          pnpm --filter @dsh-enhanced/lark-channel exec vitest run --testTimeout=15000 tests/rsi-native-profile.spec.ts tests/rsi-native-install.spec.ts tests/rsi-native-launchd.spec.ts tests/native-lifecycle-lock.spec.ts tests/rsi-local-install.spec.ts tests/rsi-build.spec.ts tests/rsi-creation-build.spec.ts tests/rsi-source.spec.ts tests/rsi-source-cli.spec.ts tests/setup.spec.ts
          pnpm --filter @dsh-enhanced/lark-channel exec vitest run --testTimeout=15000 tests/launchd.spec.ts tests/launchd-control.spec.ts
          pnpm --filter @dsh-enhanced/dsh-rsi-cli exec vitest run --testTimeout=15000
          pnpm exec vitest run --testTimeout=15000 --dir tests tests/macos-launchd-lock.spec.ts tests/macos-launchd-service.spec.ts tests/macos-purge-fallback.spec.ts tests/install-setup-runtime.spec.ts

      # macOS only owns platform-specific behavior (launchd, /var symlinks,
      # socket/state fixtures and the lark/rsi-cli native paths) covered by the
      # early step above. Repository-wide validate/lint/build/package tests and
      # pack checks already run on the Linux lanes, so a second full `pnpm check`
      # here would duplicate ~20 minutes on the slower arm64 runner.
      - name: Verify repository (macOS-specific only)
        id: repository
        run: pnpm run validate && pnpm run lint

  windows-acp-smoke:
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Windows mode policy
        run: pnpm --filter @dsh-enhanced/acp test -- --testTimeout=15000

      - name: Pack ACP plugin
        shell: pwsh
        run: pnpm --filter @dsh-enhanced/acp pack --pack-destination $env:RUNNER_TEMP

      - name: Install DSH and packed plugin in a clean profile
        shell: pwsh
        run: |
          npm install --global --no-audit --no-fund @deepseek-ai/dsh@0.2.2-rc.1
          if ($LASTEXITCODE -ne 0) { throw "failed to install DSH" }

          $env:DSH_HOME = Join-Path $env:RUNNER_TEMP "dsh-home"
          $acpPackage = Get-Content "./plugins/acp/package.json" | ConvertFrom-Json
          $acpVersion = $acpPackage.version
          $tarball = Join-Path $env:RUNNER_TEMP "dsh-enhanced-acp-$acpVersion.tgz"
          $installOutput = (& dsh plugin --profile acp add $tarball 2>&1 | Out-String)
          $installExit = $LASTEXITCODE
          Write-Output $installOutput
          if ($installExit -ne 0) { throw "failed to install packed ACP plugin" }
          if ($installOutput -match "missing peer|Issues with peer dependencies") {
            throw "packed ACP plugin emitted peer dependency warnings"
          }

          dsh --profile acp --dump-config | Out-File (Join-Path $env:RUNNER_TEMP "acp-config.txt")
          if ($LASTEXITCODE -ne 0) { throw "failed to compose ACP profile" }

          $env:DSH_ACP_EXPECTED_VERSION = $acpVersion
          node ./plugins/acp/scripts/stdio-smoke.mjs
          if ($LASTEXITCODE -ne 0) { throw "ACP stdio smoke failed" }
