name: Approval browser verification

on:
  push:
    branches: [fix/approval-interaction]
    paths: [.github/workflows/approval-repair.yml]

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 1bc2bf92d0b0ec80dfd969696fcad3acd23d8dee
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm
      - name: Verify native Linux sandbox prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends bubblewrap file git python3 tar
          if [[ -r /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]] && [[ "$(</proc/sys/kernel/apparmor_restrict_unprivileged_userns)" == 1 ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          /usr/bin/bwrap --unshare-all --die-with-parent --new-session --ro-bind /usr /usr --ro-bind /lib /lib --ro-bind /lib64 /lib64 --proc /proc --dev /dev /usr/bin/true
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install exact Host and Chromium
        run: |
          npm install --global --no-audit --no-fund --allow-scripts=@deepseek-ai/dsh-subprocess-local,koffi,node-pty @deepseek-ai/dsh@0.1.5-rc.2
          pnpm exec playwright install --with-deps chromium
      - name: Exercise native Web approval and resume
        run: pnpm test:web-owner
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: approval-web-regression
          path: .cache/web-owner-e2e
          retention-days: 3
