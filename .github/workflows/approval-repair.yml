name: Verify and stage native Web client repair
on:
  push:
    branches: [fix/approval-interaction]
    paths: [.github/workflows/approval-repair.yml, .github/patches/web-native-client.py]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        host: [0.1.2-rc.1, 0.1.5-rc.1]
    defaults:
      run:
        working-directory: candidate
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: repair-source
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 1bc2bf92d0b0ec80dfd969696fcad3acd23d8dee
          path: candidate
          persist-credentials: false
      - name: Apply only the reviewed repair to the exact candidate
        run: python3 ../repair-source/.github/patches/web-native-client.py
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: candidate/pnpm-lock.yaml
      - name: Verify native Linux sandbox prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends bubblewrap file git python3 tar
          if [[ -r /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]] && [[ "$(</proc/sys/kernel/apparmor_restrict_unprivileged_userns)" == 1 ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          /usr/bin/bwrap --unshare-all --die-with-parent --new-session --ro-bind /usr /usr --ro-bind /lib /lib --ro-bind /lib64 /lib64 --proc /proc --dev /dev /usr/bin/true
      - name: Install a private supported Host
        env:
          HOST_VERSION: ${{ matrix.host }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/approval-host" .cache/web-owner-e2e
          printf '%s\n' '{"private":true,"allowScripts":{"@deepseek-ai/dsh-subprocess-local":true,"koffi":true,"node-pty":true}}' > "$RUNNER_TEMP/approval-host/package.json"
          npm install --prefix "$RUNNER_TEMP/approval-host" --prefer-dedupe --no-audit --no-fund "@deepseek-ai/dsh@$HOST_VERSION" 2>&1 | tee .cache/web-owner-e2e/host-install.log
          npm dedupe --prefix "$RUNNER_TEMP/approval-host" --ignore-scripts --no-audit --no-fund 2>&1 | tee -a .cache/web-owner-e2e/host-install.log
          echo "$RUNNER_TEMP/approval-host/node_modules/.bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Check workspace contract, lint and owner types/tests
        run: |
          pnpm validate
          pnpm lint
          pnpm --filter @dsh-enhanced/assistant-web-owner typecheck
          pnpm --filter @dsh-enhanced/assistant-web-owner test --testTimeout=15000
      - run: pnpm exec playwright install --with-deps chromium
      - name: Attach startup diagnostics to the private browser fixture
        shell: bash
        run: |
          mkdir -p .cache
          cat > .cache/approval-startup-logger.mjs <<'JS'
          import { inspect } from 'node:util'
          export const name = 'approval-startup-logger'
          export function apply(ctx) {
            const log = message => console.error('[startup]', inspect(message, { depth: 4, colors: false }))
            for (const message of ctx.logger.buffer) log(message)
            ctx.logger.exporter({ export: log })
          }
          JS
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/e2e/web-owner.spec.mjs')
          text = path.read_text()
          anchor = "    const patch = parseDocument(await readFile(patchPath, 'utf8'))\n"
          assert text.count(anchor) == 1
          text = text.replace(anchor, anchor + "    patch.add({ id: 'hmr', disabled: false })\n    patch.add({ insert: [{ id: 'approval-startup-logger', name: resolve(root, '.cache/approval-startup-logger.mjs') }] })\n")
          path.write_text(text)
          PY
      - name: Exercise native Web approval, reply and restart recovery
        run: pnpm test:web-owner
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-web-client-${{ matrix.host }}
          path: candidate/.cache/web-owner-e2e
          retention-days: 3
  stage:
    needs: browser
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: repair-source
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/web-native-client
          path: candidate
      - name: Commit only verified source to the repair branch, never main or dev
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 1bc2bf92d0b0ec80dfd969696fcad3acd23d8dee
          python3 ../repair-source/.github/patches/web-native-client.py
          git add plugins/assistant-web-owner/src/native-client.ts plugins/assistant-web-owner/src/index.ts plugins/assistant-web-owner/src/client.ts plugins/assistant-web-owner/scripts/build-client.mjs plugins/assistant-web-owner/package.json plugins/assistant-web-owner/tests/index.spec.ts plugins/assistant-web-owner/tests/native-client.spec.ts plugins/assistant-web-owner/README.md scripts/e2e/web-owner.spec.mjs docs/architecture.md pnpm-lock.yaml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: reuse installed native Web Session client with owner-scoped Host adapter'
          git push origin HEAD:refs/heads/fix/web-native-client
          echo "Verified repair commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
