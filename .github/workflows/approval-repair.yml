name: Approval repair verification

on:
  push:
    branches: [fix/approval-interaction]
    paths: [.github/workflows/approval-repair.yml]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      source: ${{ steps.prepare.outputs.source }}
      release: ${{ steps.prepare.outputs.release }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Decode and verify exact tested patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/dev)" = aca468007b7b58340acad4cdf8424191b0f4ffbb
          test "$(git rev-parse origin/main)" = aca468007b7b58340acad4cdf8424191b0f4ffbb
          python3 - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          encoded = Path('.github/approval-fix.patch.gz.b64').read_text().strip()
          # Restore the separately pinned prefix after text transport truncation.
          anchor = 'EM7pmg+9rFuHowBGKKMhva9i/b8V84vJ6tLZ+'
          prefix = ''
          assert encoded.count(anchor) == 1
          patch = gzip.decompress(base64.b64decode(prefix + anchor + encoded.split(anchor)[1], validate=True))
          assert hashlib.sha256(patch).hexdigest() == '8a47c3bfde0ff8da53e1cf17fdd52b012c78bd5c7b3a96e8b1a69a51043d0cbc'
          Path('/tmp/approval-fix.patch').write_bytes(patch)
          PY
          git apply --check --index --unidiff-zero /tmp/approval-fix.patch
          git apply --index --unidiff-zero /tmp/approval-fix.patch
          git rm .github/workflows/approval-repair.yml .github/approval-fix.patch.gz.b64
          test "$(git write-tree)" = b1c6378208fbc8e8ec86101a4fd3ee7a2cbacecc
      - name: Prepare clean source and version commits
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          source="$(printf '%s\n' 'fix: route actionable approvals to owner channels before Web remotes' | git commit-tree b1c6378208fbc8e8ec86101a4fd3ee7a2cbacecc -p aca468007b7b58340acad4cdf8424191b0f4ffbb)"
          git reset --hard "$source"
          node scripts/release-version.mjs prepare 0.1.43
          node --input-type=module - <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs'
          const path = 'plugins/assistant-delivery/package.json'
          const manifest = JSON.parse(readFileSync(path, 'utf8'))
          manifest.peerDependencies['@dsh-enhanced/assistant-policy'] = '>=0.1.43 <0.2.0'
          writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n')
          JS
          pnpm install --lockfile-only --ignore-scripts
          node scripts/release-version.mjs verify-tag v0.1.43
          git add -u
          git commit -m 'chore(release): prepare v0.1.43'
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "release=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf 'Source: %s\nRelease: %s\nTree: %s\n' "$source" "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})"
      - name: Publish isolated candidate branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/dev --jq .object.sha)" = aca468007b7b58340acad4cdf8424191b0f4ffbb
          test "$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/main --jq .object.sha)" = aca468007b7b58340acad4cdf8424191b0f4ffbb
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" push "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/fix/approval-ready

  browser:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.release }}
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install exact Host and Chromium
        run: |
          npm install --global --no-audit --no-fund @deepseek-ai/dsh@0.1.5-rc.2
          pnpm exec playwright install --with-deps chromium
      - name: Exercise native Web approval and resume
        run: pnpm test:web-owner
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: approval-web-regression
          path: .cache/web-owner-e2e
          retention-days: 3
