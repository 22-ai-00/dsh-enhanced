name: Approval browser Host isolation
on:
  push:
    branches: [fix/approval-interaction]
    paths: [.github/workflows/approval-repair.yml]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        host: [0.1.2-rc.1, 0.1.5-rc.1]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 1bc2bf92d0b0ec80dfd969696fcad3acd23d8dee
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm
      - name: Verify native Linux sandbox prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends bubblewrap file git python3 tar
          if [[ -r /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]] && [[ "$(</proc/sys/kernel/apparmor_restrict_unprivileged_userns)" == 1 ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          /usr/bin/bwrap --unshare-all --die-with-parent --new-session --ro-bind /usr /usr --ro-bind /lib /lib --ro-bind /lib64 /lib64 --proc /proc --dev /dev /usr/bin/true
      - name: Install a private supported Host
        env:
          HOST_VERSION: ${{ matrix.host }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/approval-host" .cache/web-owner-e2e
          printf '%s\n' '{"private":true,"allowScripts":{"@deepseek-ai/dsh-subprocess-local":true,"koffi":true,"node-pty":true}}' > "$RUNNER_TEMP/approval-host/package.json"
          npm install --prefix "$RUNNER_TEMP/approval-host" --prefer-dedupe --no-audit --no-fund "@deepseek-ai/dsh@$HOST_VERSION" 2>&1 | tee .cache/web-owner-e2e/host-install.log
          npm dedupe --prefix "$RUNNER_TEMP/approval-host" --ignore-scripts --no-audit --no-fund 2>&1 | tee -a .cache/web-owner-e2e/host-install.log
          echo "$RUNNER_TEMP/approval-host/node_modules/.bin" >> "$GITHUB_PATH"
          find "$RUNNER_TEMP/approval-host/node_modules" -type d \( -name dsh-api-session-controller -o -name dsh-win32-process -o -name dsh-hmr \) > .cache/web-owner-e2e/host-package-paths.txt
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Activate native HMR before startup and export startup errors
        shell: bash
        run: |
          mkdir -p .cache
          cat > .cache/approval-startup-logger.mjs <<'JS'
          import { inspect } from 'node:util'
          export const name = 'approval-startup-logger'
          export function apply(ctx) {
            const log = message => console.error('[startup]', inspect(message, { depth: 4, colors: false }))
            for (const message of ctx.logger.buffer) log(message)
            ctx.logger.exporter({ export: log })
          }
          JS
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/e2e/web-owner.spec.mjs')
          text = path.read_text()
          anchor = "    const patch = parseDocument(await readFile(patchPath, 'utf8'))\n"
          assert text.count(anchor) == 1
          text = text.replace(anchor, anchor + "    patch.add({ id: 'hmr', disabled: false })\n    patch.add({ insert: [{ id: 'approval-startup-logger', name: resolve(root, '.cache/approval-startup-logger.mjs') }] })\n")
          path.write_text(text)
          PY
      - name: Exercise native Web approval and resume
        run: pnpm test:web-owner
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: approval-web-isolated-${{ matrix.host }}
          path: .cache/web-owner-e2e
          retention-days: 3
