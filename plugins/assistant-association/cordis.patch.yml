- insert:
    - id: dsh-ray-assistant-association
      name: '@dsh-ray/assistant-association'
      inject:
        - assistantPolicy
      config:
        enabled: true
        localOnly: true
        databasePath: !!js dshHomePath('assistant-association/state.sqlite')
        hotPathBudgetMs: 4.5
        maxItems: 8
        minItems: 5
        maxContextTokens: 400
        maxHops: 2
        hopTopN: 32
        maxFanoutPerNode: 128
        hysteresisDelta: 0.15
        holdoutRateBps: 1250
        syncIntervalMs: 15000
        allowLowTrust: true
        dreaming:
          enabled: true
        intakeSignal:
          enabled: true
        webLearning:
          enabled: true
