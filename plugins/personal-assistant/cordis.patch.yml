- id: permission
  name: '@deepseek-ai/dsh-permission-presets'
  config:
    presets:
      workspace-write:
        sandbox: workspace-write
        approval: ask
        name: 请求批准
      auto:
        sandbox: workspace-write
        approval: ask
        name: 帮我批准
      danger-full-access:
        sandbox: danger-full-access
        approval: never
        name: 完全访问权限
    # A fresh profile must be useful without silently granting the Host
    # unrestricted filesystem/network access.  The owner can explicitly pick
    # `danger-full-access` in DSH's native selector (or via the installer
    # confirmation) after understanding the consequence.
    defaultPreset: workspace-write

- insert:
    - id: dsh-enhanced-personal-assistant
      name: '@dsh-enhanced/personal-assistant'
      config:
        assistantPolicy:
          databasePath: !!js dshHomePath('assistant-policy/policy.sqlite')
          rules:
            - id: dsh-enhanced-foreground-capability-*
              effect: allow
              subject:
                kind: agent
                id: '*'
                workspace: '*'
              actions:
                - '*'
              resource:
                kind: '*'
                id: '*'
              context:
                initiators:
                  - foreground
          budgets: []
        personalMemory:
          databasePath: !!js dshHomePath('personal-memory/memory.sqlite')
          approvalMode: delivery-required
          maxContentBytes: 4096
          maxRecordsPerIdentity: 1000
          searchLimit: 20
          snapshotLimit: 20
          snapshotMaxBytes: 8192
          snapshotMaxTokens: 2048
          defaultProposalTtlMs: 900000
          maxImportRecords: 100
          reconcileIntervalMs: 15000
          reconcileLimit: 50
        personalWiki:
          vaultRoot: !!js dshHomePath('personal-wiki/vault')
          databasePath: !!js dshHomePath('personal-wiki/state.sqlite')
          maxPageBytes: 1048576
          searchLimit: 20
          maxSnippetBytes: 2048
          readMaxBytes: 8192
          readMaxParagraphs: 40
          lintLimit: 200
          defaultProposalTtlMs: 900000
          reconcileIntervalMs: 15000
          reconcileLimit: 50
        assistantAutomations:
          databasePath: !!js dshHomePath('assistant-automations/state.sqlite')
          runsPath: !!js dshHomePath('assistant-automations/runs')
          schedulerEnabled: false
          tickIntervalMs: 5000
          dutyLeaseMs: 15000
          taskLeaseMs: 30000
          misfireGraceMs: 60000
          maxCatchUp: 100
          maxConcurrency: 1
          maxArtifactBytes: 1048576
          defaultProposalTtlMs: 900000
          reconcileIntervalMs: 15000
          reconcileLimit: 50
          toolCapableProviders:
            - deepseek-official
