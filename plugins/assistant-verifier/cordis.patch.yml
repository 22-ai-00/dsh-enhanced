- insert:
    - id: dsh-ray-assistant-verifier
      name: '@dsh-ray/assistant-verifier'
      config:
        databasePath: !!js dshHomePath('assistant-verifier/verification.sqlite')
        tickIntervalMs: 5000
        authorities: []
        profiles: []
        # Bundled patch ships profiles: [] (no static foreground-turn profiles); ordinary chat must not be blocked on preconfigured task scenarios.
        requireAcceptance: false
