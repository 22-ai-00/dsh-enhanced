- insert:
    - id: dsh-enhanced-assistant-automations
      name: '@dsh-enhanced/assistant-automations'
      inject:
        - assistantPolicy
      config:
        databasePath: !!js dshHomePath('assistant-automations/state.sqlite')
        runsPath: !!js dshHomePath('assistant-automations/runs')
        schedulerEnabled: false
        tickIntervalMs: 5000
        dutyLeaseMs: 15000
        taskLeaseMs: 30000
        misfireGraceMs: 60000
        maxCatchUp: 100
        maxConcurrency: 1
        maxArtifactBytes: 1048576
        defaultProposalTtlMs: 900000
        reconcileIntervalMs: 15000
        reconcileLimit: 50
        allowUnbudgetedExecution: false
        proposalDefaults:
          provider: deepseek-official
          model: deepseek-chat
          allowedTools: []
          timeoutMs: 60000
          maxOutputTokens: 512
          maxToolCalls: 0
          misfireKind: latest
          misfireLimit: 1
          overlap: skip
          retrySafety: never
          maxRetries: 0
          budgetId: assistant-automations-proposals
          budgetAmount: 1
