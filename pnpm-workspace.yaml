  '@deepseek-ai/cordis': 4.0.1
  '@deepseek-ai/cordis-plugin-loader': 1.0.2
  '@types/node': 22.20.0
  oxlint: 1.76.0
  typescript: 6.0.3
  vitest: 4.1.8
  zod: 4.4.3

linkWorkspacePackages: true

# pnpm denies dependency build scripts unless they are reviewed here.
allowBuilds:
  esbuild: true
  # protobufjs only prints a dependency-version advisory; the SDK ships built output.
  protobufjs: false

minimumReleaseAgeExclude:
